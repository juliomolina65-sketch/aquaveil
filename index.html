<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Loading…</title>
<meta name="description" content="" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

<div data-site-announce></div>
<header data-site-header></header>

<main>

  <!-- ── Full-bleed landscape hero ──────────────────────────────────── -->
  <section class="banner banner--hero" data-hero-align>
    <img class="banner__bg" data-l-image alt="" />
    <span class="banner__scrim"></span>
    <div class="wrap banner__in">
      <div class="banner__rating" data-l-rating hidden></div>
      <span class="eyebrow eyebrow--light" data-l-eyebrow></span>
      <h1 class="banner__title" data-l-title></h1>
      <p class="banner__lede" data-l-body></p>
      <div class="banner__actions">
        <a class="btn btn--primary btn--lg" data-l-cta href="product.html"></a>
        <a class="btn btn--glass btn--lg" href="#how">How it works</a>
      </div>
    </div>
  </section>

  <!-- ── Highlight strip ────────────────────────────────────────────── -->
  <section class="hstrip"><div class="wrap hstrip__in" data-l-ticks></div></section>

  <!-- ── Trust strip ────────────────────────────────────────────────── -->
  <section class="press"><div class="wrap press__in" data-press></div></section>

  <!-- ── Three pillars ──────────────────────────────────────────────── -->
  <section class="section" id="how">
    <div class="wrap">
      <div class="section__head reveal">
        <span class="eyebrow">Why it works</span>
        <h2 class="h2">Fix the water, fix the rest</h2>
      </div>
      <div class="benefits benefits--3" data-l-pillars></div>
    </div>
  </section>

  <!-- ── Featured product ───────────────────────────────────────────── -->
  <section class="section section--tint">
    <div class="wrap">
      <div class="section__head reveal">
        <span class="eyebrow">The product</span>
        <h2 class="h2">One head. Everything included.</h2>
      </div>
      <div class="feat reveal" data-l-featured></div>
    </div>
  </section>

  <!-- ── Mid-page full-bleed banner ─────────────────────────────────── -->
  <section class="banner banner--mid" data-mid-banner hidden>
    <img class="banner__bg" data-mid-img alt="" />
    <span class="banner__scrim banner__scrim--bottom"></span>
    <div class="wrap banner__in banner__in--center">
      <span class="eyebrow eyebrow--light" data-mid-eyebrow></span>
      <h2 class="banner__title banner__title--sm" data-mid-title></h2>
      <p class="banner__lede" data-mid-body></p>
      <a class="btn btn--light btn--lg" data-mid-cta href="product.html"></a>
    </div>
  </section>

  <!-- ── Cartridge proof ────────────────────────────────────────────── -->
  <section class="section" id="proof">
    <div class="wrap">
      <div class="section__head reveal">
        <span class="eyebrow" data-proof-eyebrow></span>
        <h2 class="h2" data-proof-title></h2>
        <p class="lede" data-proof-body></p>
      </div>
      <div class="proof reveal">
        <figure class="proof__side">
          <img data-proof-before-img alt="" />
          <figcaption data-proof-before-label></figcaption>
        </figure>
        <div class="proof__vs">→</div>
        <figure class="proof__side">
          <img data-proof-after-img alt="" />
          <figcaption data-proof-after-label></figcaption>
        </figure>
      </div>
      <p class="proof__note" data-proof-note></p>
    </div>
  </section>

  <!-- ── Reviews ────────────────────────────────────────────────────── -->
  <section class="section section--tint" id="reviews">
    <div class="wrap">
      <div class="section__head reveal">
        <span class="eyebrow">Reviews</span>
        <h2 class="h2">What people noticed first</h2>
        <div class="rating rating--lg" data-l-rating-big></div>
      </div>
      <div class="reviews" data-l-reviews></div>
      <div class="reviews__foot reveal">
        <a class="btn btn--ghost" href="product.html#reviews" data-l-more-reviews hidden></a>
        <button class="btn btn--primary" type="button" data-open-review>Leave a review</button>
      </div>
    </div>
  </section>

  <!-- ── Guarantee ──────────────────────────────────────────────────── -->
  <section class="section section--tint">
    <div class="wrap">
      <div class="guarantee reveal">
        <div class="guarantee__seal"><svg class="ico ico--xl"><use href="#i-shield"/></svg><span>40<small>days</small></span></div>
        <div>
          <h2 class="h3" data-guarantee-title></h2>
          <p class="lede" data-guarantee-body></p>
          <p class="sig" data-guarantee-sig></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Closing CTA ────────────────────────────────────────────────── -->
  <section class="finalcta">
    <div class="wrap wrap--narrow finalcta__in reveal">
      <h2 class="h2" data-l-closing-title></h2>
      <p class="lede" data-l-closing-body></p>
      <a class="btn btn--light btn--lg" href="product.html">Shop now — <span data-l-price></span></a>
      <div class="finalcta__note">Free shipping · 40-day refund · No subscription</div>
    </div>
  </section>

</main>

<footer data-site-footer></footer>

<!-- ── Leave-a-review modal ─────────────────────────────────────────── -->
<div class="modal" id="reviewModal" hidden>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
    <button class="iconbtn modal__close" type="button" data-close-review aria-label="Close">✕</button>
    <form class="revform" data-review-form novalidate>
      <span class="eyebrow">Leave a review</span>
      <h3 class="h3" id="reviewTitle">How's your hair doing?</h3>
      <div class="starpick" data-starpick role="radiogroup" aria-label="Star rating">
        <button type="button" data-v="1" aria-label="1 star">★</button>
        <button type="button" data-v="2" aria-label="2 stars">★</button>
        <button type="button" data-v="3" aria-label="3 stars">★</button>
        <button type="button" data-v="4" aria-label="4 stars">★</button>
        <button type="button" data-v="5" aria-label="5 stars">★</button>
        <span class="starpick__label" data-starpick-label>Tap a star</span>
      </div>
      <input type="hidden" name="rating" value="" />
      <div class="revform__row">
        <label class="field"><span>Your name</span><input type="text" name="name" placeholder="First name, last initial" required /></label>
        <label class="field"><span>City</span><input type="text" name="location" placeholder="Dallas, TX" /></label>
      </div>
      <label class="field"><span>What changed most?</span>
        <select name="group">
          <option value="">Pick one (optional)</option>
          <option value="frizz">Frizz</option>
          <option value="colour">Colour fading</option>
          <option value="breakage">Breakage</option>
          <option value="scalp">Flaky scalp</option>
          <option value="skin">Dry skin</option>
        </select>
      </label>
      <label class="field"><span>Headline</span><input type="text" name="title" placeholder="One line" required /></label>
      <label class="field"><span>Your review</span><textarea name="body" rows="4" placeholder="What did you notice, and how long did it take?" required></textarea></label>
      <button class="btn btn--primary btn--block btn--lg" type="submit">Submit review</button>
      <p class="revform__note" data-review-note></p>
    </form>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.4 3 8 7 9 4-1 7-4.6 7-9V6l-7-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 4C10 4 4 9 4 15a5 5 0 0 0 5 5c6 0 11-6 11-16z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 20 14 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="18" r="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<script src="assets/js/product.js"></script>
<script src="assets/js/chrome.js"></script>
<script src="assets/js/landing.js"></script>
</body>
</html>
